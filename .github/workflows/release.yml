name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify the release tag points to current main
        run: |
          git fetch origin main
          test "$(git rev-list -n 1 "$GITHUB_SHA")" = "$(git rev-parse origin/main)"
      - name: Run the release test suite
        run: |
          git diff --check
          python3 -m compileall -q dsh_forge scripts tests
          python3 scripts/embed_catalog.py
          git diff --exit-code -- web/launcher.js
          node --test tests/catalog.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build the portable web release
        run: |
          mkdir -p dist
          python3 scripts/package_preview.py dist/DSH_Forge_Release.html
          sha256sum dist/DSH_Forge_Release.html > dist/SHA256SUMS-Web.txt
      - name: Upload the portable release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          python -m pip install --requirement packaging/windows/requirements-build.txt
          choco install innosetup --version 6.7.3 --no-progress --yes
      - name: Import the Authenticode release certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64 -or -not $env:SIGNING_CERTIFICATE_PASSWORD) {
            throw 'Configure WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD before publishing a Windows release.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dsh-forge-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          Remove-Item -LiteralPath $pfxPath -Force
          $certificate = $certificates | Where-Object {
            $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId.Value -contains '1.3.6.1.5.5.7.3.3')
          } | Select-Object -First 1
          if (-not $certificate) { throw 'The PFX does not contain a private key authorized for code signing.' }
          "CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build and sign the Windows application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          ./packaging/windows/build.ps1 -Version $version -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
      - name: Smoke-test the signed installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist/windows -Filter 'DSH-Forge-*-Setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)." }
          ./packaging/windows/smoke.ps1 -InstallerPath $installers[0].FullName
      - name: Upload the Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/windows/
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: AppleSilicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned packaging tools
        run: python3 -m pip install --requirement packaging/macos/requirements-build.txt
      - name: Import the Developer ID certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE_BASE64" || -z "$SIGNING_CERTIFICATE_PASSWORD" ]]; then
            echo "Configure the macOS signing certificate secrets before publishing." >&2
            exit 1
          fi
          certificate="$RUNNER_TEMP/dsh-forge-signing.p12"
          keychain="$RUNNER_TEMP/dsh-forge-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$SIGNING_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f -- "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The PKCS#12 file does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize the macOS application
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/macos/build.sh "$version" "${{ matrix.arch }}" "$SIGNING_IDENTITY"
      - name: Smoke-test the notarized disk image
        run: |
          images=(dist/macos/DSH-Forge-*-macOS-${{ matrix.label }}.dmg)
          if [[ ${#images[@]} -ne 1 || ! -f "${images[0]}" ]]; then
            echo "Expected one macOS disk image." >&2
            exit 1
          fi
          ./packaging/macos/smoke.sh "${images[0]}"
      - name: Upload the macOS release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/macos/
          if-no-files-found: error
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_KEYCHAIN:-}" && -f "$MACOS_KEYCHAIN" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN"
          fi

  release:
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "DSH Forge $GITHUB_REF_NAME"
