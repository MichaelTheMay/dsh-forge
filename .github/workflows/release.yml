name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the release tag belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run the release test suite
        run: |
          git diff --check
          python3 -m compileall -q dsh_forge scripts tests
          python3 scripts/embed_catalog.py
          git diff --exit-code -- web/launcher.js
          node --test tests/catalog.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build release assets
        run: |
          mkdir -p dist
          python3 scripts/package_preview.py dist/DSH_Forge_Release.html
          sha256sum dist/DSH_Forge_Release.html > dist/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/DSH_Forge_Release.html \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "DSH Forge $GITHUB_REF_NAME"
