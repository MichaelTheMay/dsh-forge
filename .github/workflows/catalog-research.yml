name: Catalog research queue

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Index the external plugin catalog and GitHub fork network
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/index_registry.py --output dist/registry-raw.json
      - name: Analyze a bounded set of promising forks at immutable commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/analyze_registry.py --snapshot dist/registry-raw.json --output dist/registry.json
      - name: Build the evidence-ranked hidden-gem queue
        run: python3 scripts/research_catalog.py --snapshot dist/registry.json --output dist/hidden-gems.json
      - name: Build the compressed public feed
        run: >-
          python3 scripts/build_catalog_feed.py
          --registry dist/registry.json
          --queue dist/hidden-gems.json
          --base-url https://github.com/${{ github.repository }}/releases/download/catalog-latest
          --output-dir dist/feed
      - name: Validate the queue contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          queue = json.loads(Path('dist/hidden-gems.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('dist/registry.json').read_text(encoding='utf-8'))
          assert queue['schema'] == 'dsh-forge.discovery-queue/v2'
          assert queue['source_count'] >= queue['candidate_count'] > 0
          assert queue['quality']['selection_policy'] == 'dsh-forge.discovery-diversity/v1'
          assert queue['quality']['unique_owners'] > 0
          assert registry['coverage']
          assert all(item['status'] in {'complete', 'incomplete'} for item in registry['coverage'])
          analysis = next(item for item in registry['coverage'] if item['source'] == 'github-rest/fork-analysis')
          assert analysis['selected_count'] == analysis['analyzed_count'] + analysis['failed_count']
          assert analysis['limit'] == 100
          assert queue['claims'] == {
              'executed': False,
              'metadata_only': True,
              'security_verified': False,
          }
          feed = json.loads(Path('dist/feed/registry-feed.json').read_text(encoding='utf-8'))
          assert feed['schema'] == 'dsh-forge.registry-feed/v1'
          assert feed['snapshot_id'] == registry['snapshot_id'] == queue['snapshot_id']
          assert feed['claims'] == {
              'executed': False,
              'metadata_only': True,
              'security_verified': False,
              'signed': False,
          }
          PY
      - name: Retain the review queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hidden-gem-research-${{ github.run_id }}
          path: |
            dist/registry.json
            dist/hidden-gems.json
            dist/feed/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main'
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Restore the validated feed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hidden-gem-research-${{ github.run_id }}
          path: dist
      - name: Publish the current public catalog feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view catalog-latest >/dev/null 2>&1; then
            gh release create catalog-latest \
              --target "$GITHUB_SHA" \
              --title "DSH Forge public catalog" \
              --notes "Continuously refreshed metadata-only plugin and fork catalog. Checksums provide transport integrity; this feed is not curator-signed and does not authorize installation." \
              --prerelease \
              --latest=false
          fi
          gh release upload catalog-latest \
            dist/feed/registry.json.gz \
            dist/feed/hidden-gems.json.gz \
            --clobber
          gh release upload catalog-latest dist/feed/registry-feed.json --clobber
